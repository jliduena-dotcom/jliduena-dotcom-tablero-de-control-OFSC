name: Deploy Streamlit on push to main

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync files to server
        run: |
          rsync -avz --delete --exclude='.git' ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DIR }}
        env:
          RSYNC_RSH: ssh

      - name: Restart Streamlit service on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_DIR }} && \
             # opcional: git pull && pip install -r requirements.txt && build steps... \
             sudo systemctl restart ${{ secrets.SERVICE_NAME }} && \
             sudo systemctl status ${{ secrets.SERVICE_NAME }} --no-pager"
