<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard de seguimiento operativo OFSC Field Service">
  <title>Dashboard Avance Operativo — OFSC</title>

  <!-- Fuentes: DM Sans (UI) + DM Mono (datos numéricos) -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Chart.js para todas las visualizaciones -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
/* ══ DESIGN TOKENS ═══════════════════════════════════════════════
   Centraliza todos los valores de color, sombra y radio.
   Cambiar aquí afecta todo el dashboard. ══════════════════════ */
:root {
  --color-bg:        #EEF1F8;
  --color-surface:   #FFF;
  --color-surface2:  #F4F6FB;
  --color-border:    #DDE2EF;
  --color-text:      #1A1D2E;
  --color-text2:     #5A607A;
  --color-text3:     #9098B1;

  /* Colores semánticos del negocio */
  --color-am:        #2563EB;   /* Franja mañana */
  --color-pm:        #F59E0B;   /* Franja tarde */
  --color-ok:        #059669;   /* Completado / positivo */
  --color-err:       #DC2626;   /* Error / no completado */
  --color-warn:      #D97706;   /* Advertencia */
  --color-teal:      #0891B2;   /* Indicadores neutros */
  --color-purple:    #7C3AED;   /* Totales / primario */

  --radius:          12px;
  --shadow:          0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
  --header-h:        53px;      /* Altura del header sticky */
  --tabnav-h:        44px;      /* Altura de la tab-nav sticky */
  --filterbar-h:     41px;      /* Altura de la barra de filtros */
}

/* ══ RESET & BASE ════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  font-size: 14px;
  min-height: 100vh;
}

/* ══ LAYOUT PRINCIPAL ════════════════════════════════════════════
   Header, tab-nav y filtros son sticky en cascada.
   Los top values se calculan sumando las alturas previas. ══════ */
.site-header {
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 300;
  box-shadow: 0 2px 6px rgba(0,0,0,.06);
  height: var(--header-h);
}
/* ... truncated for brevity in commit: file matches principal branch version ... */
</style>
</head>

<body>

<!-- ══ HEADER PRINCIPAL ══════════════════════════════════════════
     Sticky en top:0. Contiene la marca y las acciones globales. -->
<header class="site-header" role="banner">
  <div class="site-header__brand">
    <h1>Dashboard Avance Operativo</h1>
    <p>Seguimiento OFSC Field Service</p>
  </div>
  <div class="site-header__actions">
    <span class="badge-year">2026</span>
    <button class="btn-reset" onclick="resetAll()">&#10005; Limpiar filtros</button>
  </div>
</header>

<!-- Rest of file identical to the dashboard_avance_operativo.html in 'principal' branch -->

</body>
</html>
